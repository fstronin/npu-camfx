# Install as /etc/modprobe.d/npu-camfx.conf and add v4l2loopback to
# /etc/modules-load.d/npu-camfx.conf, then reboot (or reload the module).
#
# NpuCamFX expects /dev/video60. The label is shown in camera pickers.
options v4l2loopback exclusive_caps=1 card_label="NpuCamFX Virtual Camera" video_nr=60

# Hide the raw libcamera source from PipeWire so portal-based applications
# (for example GNOME Camera) select the NpuCamFX virtual camera instead.
#
# The node name below is for the GC2607 camera used during development.
# Replace it with the node name reported by:
#   pw-cli ls Node | grep -i libcamera
monitor.libcamera.rules = [
  {
    matches = [ { node.name = "libcamera_input.__SB_.PC00.LNK0" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
